[tool.ruff]
target-version = "py313"
line-length = 120
# The shared modules (sign-in, accounts, mail, log, backup, keys, languages) and their contract tests come unchanged from the
# modules' own repository and are linted there.
extend-exclude = ["app/vendor/nexoidc", "tests/nexoidc", "app/vendor/nexlog", "tests/nexlog", "app/vendor/nexsicherung",
                  "tests/nexsicherung", "app/vendor/nexschluessel", "tests/nexschluessel", "app/vendor/nexkonten",
                  "tests/nexkonten", "app/vendor/nexpost", "tests/nexpost", "app/vendor/nexsprachen",
                  "tests/nexsprachen"]

[tool.ruff.lint]
extend-select = ["E501", "E402", "S608", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# F811: a fixture imported from a helper module is named again as the test's parameter.
"tests/**" = ["S101", "E501", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test that hangs fails after five minutes instead of holding the run (the longest take seconds).
timeout = 300
markers = [
    "timing: measures time against a limit; runs serially on its own (pytest -m timing), skipped in parallel workers",
]
